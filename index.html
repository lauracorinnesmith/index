var SPEED=1.35;

  else if(P.path.length){var tg=P.path[0],dx=tg[0]-P.x,dy=tg[1]-P.y,d=Math.hypot(dx,dy);

  if(P.moving){
    if(Math.abs(vx)>Math.abs(vy)*1.1)P.dir=vx<0?'left':'right';else P.dir=vy<0?'up':'down';
    if(walkable(P.x+vx,P.y+vy)){P.x+=vx;P.y+=vy;}else if(walkable(P.x+vx,P.y)){P.x+=vx;}else if(walkable(P.x,P.y+vy)){P.y+=vy;}else{P.path=[];}

function renderBoard(){
  var h='<svg class="strings" viewBox="0 0 1200 720" aria-hidden="true">';
  var sub=[600,236];
  CARDS.forEach(function(c){if(state.found[c.id])h+=str(sub[0],sub[1],c.x,c.y-62);});
  LINKS.forEach(function(l){if(state.found[l[0]]&&state.found[l[1]])h+=str(CARD[l[0]].x,CARD[l[0]].y-62,CARD[l[1]].x,CARD[l[1]].y-62,true);});

  if(state.case.letter)h+='<button class="ec found casecard'+(state.case.sealed?' closed':'')+'" data-case="1" style="left:380px;top:372px;--r:-2deg" aria-label="'+CASE_NAME+': open"><span class="pinhead"></span><span class="k">'+(state.case.sealed?'CASE CLOSED':'OPEN CASE · '+caseProgress()+'/'+CASE_STEPS.length)+'</span><span class="t">A Mycelium Mystery</span>'+(state.case.sealed?'<span class="stampc">CLOSED</span>':'')+'</button>';

  var k=0;

    h+='<button class="ec '+(f?'found':'back')+(fr?' fresh':'')+'" data-card="'+c.id+'" style="left:'+c.x+'px;top:'+c.y+'px;--r:'+c.r+'deg;--d:'+(fr?(k++)*0.25:0)+'s" aria-label="'+(f?c.title+': open':'Not found yet. '+c.hint)+'"><span class="pinhead"></span>'+
      (f?'<span class="k">'+c.kick+'</span><span class="t">'+c.title+'</span><span class="new">'+(fr?'NEW':'')+'</span>':'<span class="q">?</span><span class="hint">'+c.hint+'</span>')+'</button>';});

    if(st==='lumen'&&!state.myco.ringSeen){state.myco.ringSeen=true;openModal('SITE 2 CULTURE ON AGAR','<svg class="tcscene" viewBox="0 0 600 220"><ellipse cx="300" cy="110" rx="200" ry="80" fill="#e8f0f4" stroke="#1c110a" stroke-width="3"/><ellipse cx="300" cy="108" rx="180" ry="66" fill="#5a8ae0"/><ellipse cx="300" cy="108" rx="110" ry="40" fill="#f8f6f0"/>'+Array.apply(null,{length:22}).map(function(_,i){var a=i/22*6.283;return '<circle cx="'+(300+Math.cos(a)*112)+'" cy="'+(108+Math.sin(a)*41)+'" r="4" fill="#e8a830" stroke="#a87010"/>';}).join('')+'</svg><p>Clean, fast mycelium with a ring of amber droplets at the edge: unmistakably 0417, the same ring as Figure 3 of Verdance\'s patent. But every 0417 plate looks like this.</p><p class="dim2">To tell whose stock it came from, it has to go all the way: grain, bag, fruit.</p>');say('It\'s 0417, all right. Now it has to fruit.');}

  if(snap.FX){FX.room=snap.FX.room||'cabin';FX.x=snap.FX.x;FX.y=snap.FX.y;FX.perch=snap.FX.perch;FX.path=[];}

function lauraLetterHTML(){return '<div class="letter intro"><div class="lphoto"><span class="sclip" aria-hidden="true"></span><img src="'+LAURA_PHOTO+'" alt="Photo of Laura C. Smith"></div><div class="lh">LAURA C. SMITH</div><p>Dear Investigator,</p>'+
  '<p>Welcome to my cabin.</p><p>Growing up, I spent hours inside the Nancy Drew mysteries from Her Interactive: creaky mansions, coded notes, and that little jolt when a clue finally clicks. I still believe we learn best through play, and that the best way to meet someone is to be invited in, not handed a stale introduction. So instead of a bio, here is a door.</p>'+
  '<p>Fair warning: I have tucked a great deal of myself into these rooms, which is not exactly textbook OPSEC for an investigator. If a criminal ever tries to profile me from my bookshelf, I hope they at least pause on the way out and reconsider a few life choices.</p>'+
